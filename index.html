<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Latvian Kraft — Domain for Sale</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f6f6;
    color: #222;
    text-align: center;
}

header {
    background: #1f1f1f;
    color: white;
    padding: 30px 15px;
}

header h1 {
    font-size: 42px;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

#subtitle {
    font-size: 20px;
    opacity: 0.9;
}

button {
    margin-top: 15px;
    padding: 10px 18px;
    background: #c49a6c;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

.image-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

.image-row img {
    object-fit: cover;
    border-radius: 8px;
}

.vertical {
    width: 260px;
    height: 380px;
}

.horizontal {
    width: 420px;
    height: 260px;
}

.text {
    margin-top: 40px;
    line-height: 1.7;
    font-size: 20px;
    max-width: 750px;
    margin-left: auto;
    margin-right: auto;
}

.lead {
    font-size: 24px;
    font-weight: bold;
}

.highlight {
    font-size: 18px;
    margin-top: 20px;
}

footer {
    margin-top: 40px;
    padding: 20px;
    background: #1f1f1f;
    color: white;
    font-size: 16px;
}

a {
    color: #c49a6c;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <h1>Latvian Kraft</h1>
    <p id="subtitle">DOMAIN FOR SALE</p>
    <button onclick="switchLang()">Latviešu</button>
</header>

<div class="container">

<div class="image-row">
    <img src="img1.jpg" class="vertical" alt="">
    <img src="img2.jpg" class="horizontal" alt="">
    <img src="img3.jpg" class="vertical" alt="">
</div>

<div class="text" id="content"></div>

</div>

<footer id="footer"></footer>

<script>
let lang = "en";

const texts = {
en: {
subtitle: "Premium domain for sale",
button: "Latviešu",
content: `
<p class="lead">latviankraft.com is available for acquisition</p>

<p>This is a strong, memorable and brandable domain name — ideal for craft, artisan products, food, lifestyle or e-commerce businesses connected with Latvia.</p>

<p>The name combines authenticity with international appeal, making it suitable for both local and global markets.</p>

<p class="highlight"><strong>Rare opportunity to acquire a clean, ready-to-use brand name.</strong></p>

<p class="highlight">Serious offers only.</p>
`,
footer: `
📞 +371 26 987 327<br>
🔗 <a href="https://facebook.com/kupinatavas.kupinajumi">facebook.com/kupinatavas.kupinajumi</a>
`
},

lv: {
subtitle: "Premium domēns pārdošanā",
button: "English",
content: `
<p class="lead">latviankraft.com ir pieejams iegādei</p>

<p>Spēcīgs, viegli iegaumējams un zīmolam piemērots domēna nosaukums — ideāli der amatniecības, pārtikas, dzīvesstila vai e-komercijas projektiem.</p>

<p>Nosaukums apvieno autentiskumu ar starptautisku skanējumu, padarot to piemērotu gan vietējam, gan globālam tirgum.</p>

<p class="highlight"><strong>Reta iespēja iegūt tīru, uzreiz izmantojamu zīmola nosaukumu.</strong></p>

<p class="highlight">Izskatīsim tikai nopietnus piedāvājumus.</p>
`,
footer: `
📞 +371 26 987 327<br>
🔗 <a href="https://facebook.com/kupinatavas.kupinajumi">facebook.com/kupinatavas.kupinajumi</a>
`
}
};

function render() {
document.getElementById("subtitle").innerHTML = texts[lang].subtitle;
document.querySelector("button").innerHTML = texts[lang].button;
document.getElementById("content").innerHTML = texts[lang].content;
document.getElementById("footer").innerHTML = texts[lang].footer;
}

function switchLang() {
lang = (lang === "en") ? "lv" : "en";
render();
}

render();
</script>

</body>
</html>
